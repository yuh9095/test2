name: glibc Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glibc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            compiler: gcc
          - arch: x86-64
            runner: ubuntu-24.04
            compiler: clang
          - arch: arm64
            runner: ubuntu-24.04-arm
            compiler: gcc
          - arch: arm64
            runner: ubuntu-24.04-arm
            compiler: clang
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson ninja-build libudev-dev libpam0g-dev libsystemd-dev
      - name: Configure
        run: meson setup build
      - name: Compile
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
