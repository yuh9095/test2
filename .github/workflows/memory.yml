name: Memory Safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  address-sanitizer:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson ninja-build libudev-dev libpam0g-dev libsystemd-dev
      - name: Configure sanitizers
        run: meson setup build -Db_sanitize=address,undefined -Db_lundef=false
      - name: Compile
        run: meson compile -C build
      - name: Test with sanitizers
        run: meson test -C build --print-errorlogs --no-rebuild

  valgrind:
    name: Valgrind leak and memory checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson ninja-build valgrind libudev-dev libpam0g-dev libsystemd-dev
      - name: Configure
        run: meson setup build
      - name: Compile
        run: meson compile -C build
      - name: Test under Valgrind
        run: |
          meson test -C build --print-errorlogs --no-rebuild \
            --wrapper 'valgrind --quiet --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=99'
