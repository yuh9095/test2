name: Native multi-distribution CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-distro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distro-build-test:
    name: ${{ matrix.distro }} / ${{ matrix.arch }} / ${{ matrix.compiler }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "Ubuntu 24.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: ubuntu:24.04
            family: debian
            compiler: gcc
          - distro: "Ubuntu 24.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: ubuntu:24.04
            family: debian
            compiler: clang
          - distro: "Ubuntu 24.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            family: debian
            compiler: gcc
          - distro: "Ubuntu 24.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            family: debian
            compiler: clang
          - distro: "Debian stable"
            arch: x86_64
            runner: ubuntu-24.04
            image: debian:stable-slim
            family: debian
            compiler: gcc
          - distro: "Debian stable"
            arch: x86_64
            runner: ubuntu-24.04
            image: debian:stable-slim
            family: debian
            compiler: clang
          - distro: "Debian stable"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: debian:stable-slim
            family: debian
            compiler: gcc
          - distro: "Debian stable"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: debian:stable-slim
            family: debian
            compiler: clang
          - distro: "Fedora latest"
            arch: x86_64
            runner: ubuntu-24.04
            image: fedora:latest
            family: fedora
            compiler: gcc
          - distro: "Fedora latest"
            arch: x86_64
            runner: ubuntu-24.04
            image: fedora:latest
            family: fedora
            compiler: clang
          - distro: "Fedora latest"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: fedora:latest
            family: fedora
            compiler: gcc
          - distro: "Fedora latest"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: fedora:latest
            family: fedora
            compiler: clang
          - distro: "Alpine edge (musl)"
            arch: x86_64
            runner: ubuntu-24.04
            image: alpine:edge
            family: alpine
            compiler: gcc
          - distro: "Alpine edge (musl)"
            arch: x86_64
            runner: ubuntu-24.04
            image: alpine:edge
            family: alpine
            compiler: clang
          - distro: "Alpine edge (musl)"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: alpine:edge
            family: alpine
            compiler: gcc
          - distro: "Alpine edge (musl)"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: alpine:edge
            family: alpine
            compiler: clang
          - distro: "openSUSE Tumbleweed"
            arch: x86_64
            runner: ubuntu-24.04
            image: opensuse/tumbleweed:latest
            family: suse
            compiler: gcc
          - distro: "openSUSE Tumbleweed"
            arch: x86_64
            runner: ubuntu-24.04
            image: opensuse/tumbleweed:latest
            family: suse
            compiler: clang
          - distro: "openSUSE Tumbleweed"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: opensuse/tumbleweed:latest
            family: suse
            compiler: gcc
          - distro: "openSUSE Tumbleweed"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: opensuse/tumbleweed:latest
            family: suse
            compiler: clang
          - distro: "Arch Linux"
            arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:latest
            family: arch
            compiler: gcc
          - distro: "Arch Linux"
            arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:latest
            family: arch
            compiler: clang

          # Chimera publishes native OCI images for both supported CI
          # architectures.  Its toolchain is LLVM/Clang and its GNU Make
          # package is explicitly named gmake.
          - distro: "Chimera Linux"
            arch: x86_64
            runner: ubuntu-24.04
            image: chimeralinux/chimera:latest
            family: chimera
            compiler: clang
            profile: debug
          - distro: "Chimera Linux"
            arch: x86_64
            runner: ubuntu-24.04
            image: chimeralinux/chimera:latest
            family: chimera
            compiler: clang
            profile: release-lto
          - distro: "Chimera Linux"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: chimeralinux/chimera:latest
            family: chimera
            compiler: clang
            profile: debug
          - distro: "Chimera Linux"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: chimeralinux/chimera:latest
            family: chimera
            compiler: clang
            profile: release-lto


    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: -O2 -g -fno-common -fstack-protector-strong -Wformat=2 -Werror=format-security

    steps:
      - name: Install native distro dependencies
        shell: sh
        run: |
          set -eu
          case "${{ matrix.family }}" in
            debian)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential gcc clang meson ninja-build pkg-config \
                libudev-dev libpam0g-dev libsystemd-dev dbus-daemon
              ;;
            fedora)
              dnf install -y gcc clang meson ninja-build pkgconf-pkg-config \
                systemd-devel libudev-devel pam-devel dbus-daemon
              ;;
            alpine)
              apk add --no-cache build-base gcc clang meson ninja pkgconf \
                eudev-dev elogind-dev dbus linux-pam-dev linux-headers git
              ;;
            chimera)
              apk update
              apk add base-cbuild-bootstrap clang lld gmake meson ninja pkgconf \
                elogind-devel udev-devel linux-pam-devel dbus git
              ;;
            suse)
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends \
                gcc clang meson ninja pkgconf systemd-devel pam-devel dbus-1
              ;;
            arch)
              pacman -Syu --noconfirm --needed base-devel gcc clang meson ninja \
                pkgconf systemd pam dbus
              ;;
            *)
              echo "Unsupported distro family: ${{ matrix.family }}" >&2
              exit 2
              ;;
          esac

      - uses: actions/checkout@v4
        if: matrix.family != 'alpine' && matrix.family != 'chimera'

      - name: Checkout source in Alpine ARM64 container
        if: matrix.family == 'alpine' && matrix.arch == 'aarch64'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --filter=blob:none \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "${GITHUB_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Checkout source in Chimera container
        if: matrix.family == 'chimera'
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --filter=blob:none \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "${GITHUB_SHA}"

      - name: Record native execution environment
        run: |
          uname -a
          getconf LONG_BIT
          cat /etc/os-release
          "${CC}" --version
          meson --version
          ninja --version
          if [ "${{ matrix.family }}" = chimera ]; then
            gmake --version
            apk info -e gmake
            pkg-config --modversion libsystemd
            pkg-config --modversion libudev
          fi

      - name: Configure debug or optimized LTO profile
        run: |
          if [ "${{ matrix.profile }}" = release-lto ]; then
            meson setup build --buildtype=release -Db_lto=true
          else
            meson setup build --buildtype=debug -Db_lto=false
          fi

      - name: Compile with strict warnings
        run: meson compile -C build

      - name: Run complete test suite repeatedly
        run: |
          if [ "${{ matrix.family }}" = chimera ]; then
            meson test -C build --print-errorlogs --no-rebuild --repeat=10
          else
            meson test -C build --print-errorlogs --no-rebuild --repeat=3
          fi

      - name: Verify staged installation and executable smoke tests
        run: |
          meson install -C build --destdir "$PWD/stage"
          installed_bin="$(find stage -type f -name dinit-logind -perm -111 -print -quit)"
          test -n "$installed_bin"
          "$installed_bin" --version
          "$installed_bin" --help >/dev/null
          test -s "$installed_bin"
